version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/index
    command: npm start
    depends_on:
      - db
    environment:
      - NODE_ENV=development
      - DB_PORT=3306 
      # - DB_HOST=db
      - DB_USER=root
      - DB_PASS=root
    networks:
      - cetron

  frontend:
    build: ./frontend
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
    networks:
      - cetron
    command: npm start


  db:  
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: usuariosalcohol
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - cetron

volumes:
  db_data:

networks:
  cetron: